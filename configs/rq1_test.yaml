# A-07 RQ1 test suite (plan §15.5).
#
# 120 clean base episodes (60/family from the ``test`` split) × 6
# crossings = 720 rows. The crossings are clean + the two declared N1
# corruption channels, crossed with belief-only methods V0R0/V1R0.
run_id: rq1_test
manifests_dir: data/manifests
output_dir: runs/final
splits:
  - test
matrix:
  - method: V0R0
    condition: clean
  - method: V0R0
    condition: N1-DROP-15
  - method: V0R0
    condition: N1-FLIP-10
  - method: V1R0
    condition: clean
  - method: V1R0
    condition: N1-DROP-15
  - method: V1R0
    condition: N1-FLIP-10
notes: |
  Expected rows: 720 = 120 base × 6 crossings.
  Corruption is applied after categorical decoding and before belief storage.
  Episode seeds and crossings keep V0R0/V1R0 paired episode-by-episode.
