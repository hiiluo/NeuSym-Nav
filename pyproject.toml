[project]
name = "neuro-symbolic-vln"
version = "0.1.0"
description = "Neuro-Symbolic VLN in 2D MiniGrid"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lark>=1.3.1",
    "minigrid==3.1.0",
    "numpy>=1.26,<3",
    "pyperplan==2.1",
    "pyyaml>=6,<7",
]

[project.scripts]
ns-vln = "neuro_symbolic_vln.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Bỏ qua lỗi thiếu type hints (stubs) từ các thư viện bên ngoài không có typing
[[tool.mypy.overrides]]
module = [
    "minigrid.*",
    "pyperplan.*",
    "lark.*",
    "yaml.*",
]
ignore_missing_imports = true